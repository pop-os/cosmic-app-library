[package]
name = "cosmic-app-library"
version = "1.11.0"
authors = ["Ashley Wulber <ashley@system76.com>"]
edition = "2024"
rust-version = "1.93"

[features]
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]

[build-dependencies]
xdgen = "0.1.0"

[dependencies]
zbus = "5.12"
cosmic-launch = { git = "https://github.com/pop-os/libcosmic", features = [
    "systemd",
    "tokio",
] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = [
    "dbus-config",
    "desktop",
    "winit",
    "wayland",
    "tokio",
    "single-instance",
    "xdg-portal",
] }
tokio = { version = "1.48", features = ["sync", "rt", "process"] }
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }
pretty_env_logger = "0.5"
log = "0.4"
futures = "0.3.31"
# Application i18n
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.9"
shlex = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ron = "0.12"
notify = "*"
anyhow = "1.0"
itertools = "0.14"
url = "2.5"
nix = "0.30"
clap = { version = "4.5", features = ["derive"] }
cosmic-app-list-config = { git = "https://github.com/pop-os/cosmic-applets" }

[profile.release]
lto = "thin"

[patch."https://github.com/pop-os/libcosmic/"]
cosmic-config = { git = "https://github.com/pop-os/libcosmic//", branch = "bundles" }
cosmic-launch = { git = "https://github.com/pop-os/libcosmic//", branch = "bundles" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic//", branch = "bundles" }
libcosmic = { git = "https://github.com/pop-os/libcosmic//", branch = "bundles" }
